name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 레포지토리 코드 불러오기
      uses: actions/checkout@v4

    - name: JDK 17 설정
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle 7.6.1 자동 설정
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6.1'

    - name: ZIP 파일 감지 및 압축 해제 후 빌드
      run: |
        ZIP_PATH=$(find . -name "*.zip" | head -n 1)
        
        if [ -z "$ZIP_PATH" ]; then
          echo "ZIP 파일을 찾을 수 없습니다. ZIP 파일을 저장소에 올려주세요."
          exit 1
        fi
        
        echo "발견된 ZIP 파일: $ZIP_PATH"
        unzip -o "$ZIP_PATH" -d extracted_app
        
        SETTINGS_PATH=$(find extracted_app -name "settings.gradle" | head -n 1)
        if [ -z "$SETTINGS_PATH" ]; then
          echo "ZIP 파일 내부에 settings.gradle이 없습니다."
          exit 1
        fi
        
        TARGET_DIR=$(dirname "$SETTINGS_PATH")
        echo "빌드 실행 경로: $TARGET_DIR"
        
        cd "$TARGET_DIR"
        gradle assembleDebug

    - name: APK 파일 업로드 (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Pinky-APK
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
