name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 레포지토리 코드 불러오기
      uses: actions/checkout@v4

    - name: JDK 17 설정
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle 7.6.1 설정
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.6.1'

    - name: ZIP 압축 해제 및 빌드 환경 자동 보정
      run: |
        # 1. ZIP 파일 압축 해제
        ZIP_PATH=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_PATH" ]; then
          echo "ZIP 파일 발견: $ZIP_PATH"
          unzip -o "$ZIP_PATH" -d .
        fi

        # 2. settings.gradle 위치 검색 및 이동
        SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
        if [ -z "$SETTINGS_FILE" ]; then
          echo "ZIP 파일 내에 settings.gradle이 없습니다."
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        cd "$PROJECT_DIR"

        # 3. AndroidX 사용 옵션 자동 주입
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        # 4. AGP 필수 namespace 구문 자동 주입
        APP_GRADLE=$(find . -name "build.gradle" | grep "/app/" | head -n 1)
        if [ -f "$APP_GRADLE" ] && ! grep -q "namespace" "$APP_GRADLE"; then
          sed -i '/android {/a \    namespace "com.pinky.filterapp"' "$APP_GRADLE"
        fi

        # 5. Android SDK 라이선스 강제 승인 (오류 해결 핵심)
        mkdir -p "$ANDROID_HOME/licenses"
        printf "24333f8a637173a92d6735be0a2720dce8f4f63a\n84831b9409646a2b8f358d7a493224725f324ea0\nd97531ed92a21965d14660f027bdb936658bfd9e" > "$ANDROID_HOME/licenses/android-sdk-license"
        printf "d56f518747701750570bf4599c4e8c2e92706362" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
        
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true

        # 6. APK 빌드 실행
        gradle assembleDebug --no-daemon

    - name: APK 파일 업로드 (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Pinky-APK
        path: '**/app/build/outputs/apk/debug/*.apk'
