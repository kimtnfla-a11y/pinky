name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 레포지토리 코드 불러오기
      uses: actions/checkout@v4

    - name: ZIP 파일 자동 압축 해제 및 구조 정리
      run: |
        unzip -o *.zip -d extracted
        TARGET_DIR=$(find extracted -name "build.gradle" -exec dirname {} \; | head -n 1)
        cp -r $TARGET_DIR/* .

    - name: JDK 17 설정
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle 빌드 환경 설정
      uses: gradle/actions/setup-gradle@v3

    - name: APK 파일 생성 (Debug Build)
      run: gradle assembleDebug

    - name: APK 파일 업로드 (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: Pinky-APK
        path: app/build/outputs/apk/debug/app-debug.apk
